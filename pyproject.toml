[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "time-stream"
version = "2.0.1"
description = "Time-Stream: Time Series Toolkit for Rapid Environmental Analysis and Monitoring"
readme = "README.md"
authors = [
    { name = "Oladimeji Awe", email = "olaawe@ceh.ac.uk" },
    { name = "Lewis Chambers", email = "lewcha@ceh.ac.uk" },
    { name = "Leanne Durkan", email = "leadur@ceh.ac.uk" },
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Samantha Hewkin", email = "samhew@ceh.ac.uk" },
    { name = "Josh Holland", email = "joshol@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
    { name = "Oliver Swain", email = "os@ceh.ac.uk" },
]
maintainers = [
    { name = "Leanne Durkan", email = "leadur@ceh.ac.uk" },
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Samantha Hewkin", email = "samhew@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
]
classifiers = [
"License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
license = { file = "LICENSE" }
dependencies = [
    "polars>=1.43.2",
    "numpy",
    "scipy>=1.18.0",
    "isoperiod",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
lint = [
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
    { include-group = "examples" },
]
typecheck = [
    "pyright",
]
docs = [
    "sphinx",
    "shibuya>=2026.7.12",
    "sphinx-copybutton",
    "sphinx-design>=0.6.1",
    "sphinx-iconify>=0.3.0",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
    "sphinx-contributors>=0.3.0",
    "sphinx-tabs>=3.5.0",
    "sphinxcontrib-mermaid>=2.1.0",
    "jupyter_sphinx",
    { include-group = "examples" },
]

examples = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[project.urls]
bugs = "https://github.com/NERC-CEH/time-stream/issues"
changelog = "https://github.com/NERC-CEH/time-stream/releases"
documentation = "https://nerc-ceh.github.io/time-stream/"
homepage = "https://github.com/NERC-CEH/time-stream"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["docs/source"]

[tool.ruff]
src = ["src", "tests"]
include = ["src/**.py", "tests/**.py", "docs/source/examples/**.py"]
line-length = 120

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "A",
    "PLC",
    "PLE",
    "PLW",
    "I",
    "N816",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN205",
    "ANN206",
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
# Ignore "import not at top of file" for examples code snippets
"docs/source/examples/*.py" = ["PLC0415"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]
omit = [
    "*__init__.py",
    "src/time_stream/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except PackageNotFoundError",
    "if __name__ == .__main__.",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
# "src" is here so that --doctest-modules collects the ">>>" examples in the docstrings, which are rendered
# into the API reference. The user guide's examples live in docs/source/examples and are run by
# tests/time_stream/examples/test_examples.py.
testpaths = ["tests", "src"]
addopts = "--import-mode=importlib --cov=time_stream --cov-report=term-missing --doctest-modules"
markers = ["slow: Marks slow tests"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.sources]
isoperiod = { git = "https://github.com/NERC-CEH/isoperiod.git" }
